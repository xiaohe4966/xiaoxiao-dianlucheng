<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小小电路城 · 儿童电路模拟实验室</title>
<meta name="description" content="给小朋友的电路模拟器：拖放电池、电阻、LED、喇叭、二极管、电机、灯泡和面包板，连线后通电，看电流流动，短路会爆炸。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffd166'/%3E%3Cpath d='M36 8 16 38h13l-4 20 22-32H34z' fill='%2322314a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M36 6 15 37h13l-4 21 22-33H33z" fill="#22314a" stroke="#22314a" stroke-width="3" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-text">
        <h1>小小电路城</h1>
        <p>拖一拖 · 连一连 · 通电啦</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="btnExamples" type="button"><span aria-hidden="true">📚</span><span class="hide-sm">示例</span></button>
      <button class="btn ghost" id="btnUndo" type="button" title="撤销 (Ctrl+Z)"><span aria-hidden="true">↩️</span><span class="hide-sm">撤销</span></button>
      <button class="btn ghost" id="btnClear" type="button"><span aria-hidden="true">🧹</span><span class="hide-sm">清空</span></button>
      <button class="btn ghost" id="btnHelp" type="button"><span aria-hidden="true">❓</span><span class="hide-sm">玩法</span></button>
      <button class="btn ghost" id="btnSound" type="button" aria-pressed="true"><span aria-hidden="true">🔊</span><span class="hide-sm">声音</span></button>
      <button class="btn run" id="btnRun" type="button"><span class="run-ico" aria-hidden="true">▶</span><span id="runText">通电试试</span></button>
    </div>
  </header>

  <main class="workspace">

    <aside class="panel palette">
      <div class="panel-head">
        <h2>🧰 零件箱</h2>
        <p>拖到工作台，或者点一下放进去</p>
      </div>
      <div class="parts-grid" id="partsGrid"></div>
      <div class="palette-tip">💡 电流要跑回电池另一头，才算一个完整的圈。</div>
    </aside>

    <section class="board-panel" id="boardPanel">
      <div class="board-toolbar">
        <div class="board-title">🔌 电路工作台</div>
        <div class="board-tools">
          <button type="button" id="zoomOut" title="缩小">−</button>
          <button type="button" id="zoomFit" title="适应窗口">适应</button>
          <button type="button" id="zoomIn" title="放大">＋</button>
        </div>
      </div>
      <div class="board-canvas" id="boardCanvas">
        <div class="stage-holder" id="stageHolder">
          <div class="stage" id="stage">
            <svg class="wire-layer" id="wireLayer" width="1200" height="760" viewBox="0 0 1200 760" aria-hidden="true"></svg>
            <div class="parts-layer" id="partsLayer"></div>
            <div class="effects-layer" id="effectsLayer"></div>
          </div>
        </div>
        <div class="empty-hint" id="emptyHint" hidden>
          <div class="empty-bolt">⚡</div>
          <p>把零件拖到这里<br>再用小圆点连电线</p>
        </div>
      </div>
      <div class="board-status">
        <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">点右上角「通电试试」</span></div>
        <div class="status-extra" id="statusExtra"></div>
      </div>
    </section>

    <aside class="panel inspector">
      <section class="card doctor">
        <div class="doctor-row">
          <div class="mascot" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M37 5 14 38h13l-5 22 24-35H33z" fill="#ffd166" stroke="#22314a" stroke-width="3.5" stroke-linejoin="round"/>
              <circle cx="30" cy="27" r="2.6" fill="#22314a"/><circle cx="42" cy="24" r="2.6" fill="#22314a"/>
              <path d="M31 34q5 5 10 0" fill="none" stroke="#22314a" stroke-width="2.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="bubble" id="doctorBubble">我是小电！先看看示例，再按右上角「通电试试」吧。</div>
        </div>
      </section>

      <section class="card meter">
        <h3>⚡ 电流表</h3>
        <div class="meter-value" id="meterValue">0 mA</div>
        <div class="meter-bar"><i id="meterBar"></i></div>
        <div class="meter-note" id="meterNote">还没通电，电流在睡觉</div>
      </section>

      <section class="card tasks">
        <h3>🎯 小挑战</h3>
        <div class="task-list" id="taskList"></div>
      </section>

      <section class="card inspect" id="inspectCard">
        <h3>🔍 选中的零件</h3>
        <div class="inspect-body" id="inspectBody"><p class="muted">点一个零件或一根电线，就能在这里看到它的小秘密。</p></div>
      </section>
    </aside>

  </main>
</div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
</div>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>

<script src="assets/sim.js"></script>
<script src="assets/parts.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/interact.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
